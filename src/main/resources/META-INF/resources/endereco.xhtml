<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Endereço</title>
</h:head>
<h:body>
    <h:form>
        <p:panel header="Dados do Endereço" style="width: 400px; margin: 2rem auto;">
            <p:outputLabel value="Bairro:"/><br/>
            <p:inputText value="#{enderecoBean.endereco.bairro}" readonly="true"/><br/>
            <h:outputText value="Bean resolvido? #{enderecoBean != null ? 'SIM' : 'NÃO'}" />
            <p:outputLabel value="Localidade:"/><br/>
            <p:inputText value="#{enderecoBean.endereco.localidade}" readonly="true"/><br/>

            <p:outputLabel value="UF:"/><br/>
            <p:inputText value="#{enderecoBean.endereco.uf}" readonly="true"/><br/>

            <p:outputLabel value="Estado:"/><br/>
            <p:inputText value="#{enderecoBean.endereco.estado}" readonly="true"/><br/>

            <p:outputLabel value="Região:"/><br/>
            <p:inputText value="#{enderecoBean.endereco.regiao}" readonly="true"/>
        </p:panel>
    </h:form>
</h:body>
</html>
