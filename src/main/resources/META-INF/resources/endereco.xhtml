<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Consulta de Endereço</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</h:head>
<h:body>
    <div style="margin: 20px;">
        <h:form id="enderecoForm">
            <p:panel header="Dados do Endereço" 
                     style="width: 500px; margin: 2rem auto;"
                     styleClass="ui-panel-titlebar-icon">
                
                <p:panelGrid columns="2" layout="grid" 
                             styleClass="ui-panelgrid-blank">
                    
                    <p:outputLabel for="cep" value="CEP:"/>
                    <p:inputText id="cep" 
                                value="#{enderecoBean.endereco.cep}" 
                                readonly="true" 
                                style="width: 100%;"/>
                    
                    <p:outputLabel for="logradouro" value="Logradouro:"/>
                    <p:inputText id="logradouro" 
                                value="#{enderecoBean.endereco.logradouro}" 
                                readonly="true" 
                                style="width: 100%;"/>
                    
                    <p:outputLabel for="bairro" value="Bairro:"/>
                    <p:inputText id="bairro" 
                                value="#{enderecoBean.endereco.bairro}" 
                                readonly="true" 
                                style="width: 100%;"/>

                    <p:outputLabel for="localidade" value="Localidade:"/>
                    <p:inputText id="localidade" 
                                value="#{enderecoBean.endereco.localidade}" 
                                readonly="true" 
                                style="width: 100%;"/>

                    <p:outputLabel for="uf" value="UF:"/>
                    <p:inputText id="uf" 
                                value="#{enderecoBean.endereco.uf}" 
                                readonly="true" 
                                style="width: 100%;"/>

                    <p:outputLabel for="estado" value="Estado:"/>
                    <p:inputText id="estado" 
                                value="#{enderecoBean.endereco.estado}" 
                                readonly="true" 
                                style="width: 100%;"/>

                    <p:outputLabel for="regiao" value="Região:"/>
                    <p:inputText id="regiao" 
                                value="#{enderecoBean.endereco.regiao}" 
                                readonly="true" 
                                style="width: 100%;"/>
                </p:panelGrid>
            </p:panel>
        </h:form>
    </div>
</h:body>
</html>
