spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5432/dadosapi
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring MVC
spring.mvc.servlet.path=/
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.xhtml

# JoinFaces Configuration
joinfaces.primefaces.theme=saga
joinfaces.primefaces.font-awesome=true
joinfaces.primefaces.auto-update=true

# JSF Configuration
joinfaces.primefaces.ajax-push=true
joinfaces.primefaces.legacy-widget-namespace=false

# CDI Configuration
joinfaces.cdi.scope-conversation.enabled=true

# Additional JoinFaces settings
joinfaces.primefaces.mobile-theme=auto
joinfaces.primefaces.responsive=true
joinfaces.primefaces.ripple=true

# JSF View Handler
joinfaces.primefaces.view-handler=org.primefaces.application.DialogViewHandler